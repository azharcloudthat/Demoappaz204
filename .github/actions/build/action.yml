name: Dotnet build Composite action
description: Restore, build and test a .NET project

inputs:
  configuration:
    description: 'Build configuration'
    required: false
    default: 'Release'

runs:
  using: "composite"
  steps:
    - name: Restore - Composite Action Step
      run: dotnet restore
      shell: bash

    - name: Build - Composite Action Step
      run: dotnet build --configura tion ${{ inputs.configuration }}
      shell: bash

    - name: Test - Composite Action Step
      run: dotnet test --configuration ${{ inputs.configuration }}  
      shell: bash

