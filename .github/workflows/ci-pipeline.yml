name: CI Pipeline

on:
  push:
    branches:
      - master


  workflow_dispatch:

jobs:
    build:
        runs-on: ubuntu-latest
        steps:

        - name: Checkout Code
          uses: actions/checkout@v7

        - name: setup SDK
          uses: actions/setup-dotnet@v4
          with:
            dotnet-version: '6.x'

        - name: Build with Custom Action
          uses: ./.github/actions/build
          with:
            configuration: 'Release'

        - name: Publish - Creates a Nuget Package
          run: dotnet publish --output ./nupkg

        - name: Collect/Upload
          uses: actions/upload-artifact@v7.0.2
          with:
            name: publish
            path: ./nupkg
    
    deploy:
        runs-on: ubuntu-latest
        needs: build

        steps:
        - name: Download Artifact
          uses: actions/download-artifact@v8.0.2
          with:
            name: publish
            path: ./nupkg
        
        - name: Azure Login
          uses: Azure/login@v3.0.2
          with:
            creds: ${{ secrets.AZURE_CREDENTIALS }}

        - name: Deploy to Azure
          uses: azure/webapps-deploy@v2
          with:
            app-name: tcsactions
            package: ./nupkg