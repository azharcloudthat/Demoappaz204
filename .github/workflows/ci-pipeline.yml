name: CI Pipeline

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
    build:
        runs-on: ubuntu-latest
        steps:

        - name: Checkout Code
          uses: actions/checkout@v7

        - name: setup SDK
          uses: actions/setup-dotnet@v4
          with:
            dotnet-version: '8.x'

        - name: Restore
          run: dotnet restore

        - name: Build
          run: dotnet build

        - name: Publish - Creates a Nuget Package
          run: dotnet publish --output ./publish

        - name: Collect/Upload
          uses: actions/upload-artifact@v7.0.2
          with:
            name: publish
            path: ./publish
    
    deploy:
        runs-on: ubuntu-latest
        steps:
        - name: Download Artifact
          uses: actions/download-artifact@v3
          with:
            name: publish
            path: ./publish
        
        - name: Azure Login
          uses: Azure/login@v3.0.2
          with:
            creds: ${{ secrets.AZURE_CREDENTIALS }}

        - name: Deploy to Azure
          uses: azure/webapps-deploy@v2
          with:
            app-name: tcsactions
            package: ./publish